{% extends "base.html" %}
{% block title %}Logowanie – HomeSense{% endblock %}
{% block main_class %}auth{% endblock %}
{% block content %}
<section class="card auth-card">
  <div class="auth-brand"><img src="/static/icons/favicon.svg" alt="" width="48" height="48"><span>HomeSense</span></div>
  <h1>Zaloguj się</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Nazwa użytkownika
      <input name="username" autocomplete="username" required value="{{ username or '' }}">
    </label>
    <label>Hasło
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary">Zaloguj się</button>
  </form>
</section>
{% endblock %}
