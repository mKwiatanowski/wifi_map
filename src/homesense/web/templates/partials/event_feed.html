{% if feed %}
{% for e in feed %}
<li class="feed-item">
  <span class="feed-time">{{ e.ts|when }}</span>
  <span class="dot {{ 'dot-on' if e.kind == 'arrive' else 'dot-off' }}"></span>
  <span><strong>{{ e.person }}</strong> — {{ 'przyjście do domu' if e.kind == 'arrive' else 'wyjście z domu' }}{% if e.device %} <span class="muted">({{ e.device }})</span>{% endif %}</span>
</li>
{% endfor %}
{% else %}
<li class="empty feed-empty">Brak zdarzeń z ostatnich 7 dni.</li>
{% endif %}
